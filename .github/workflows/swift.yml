name: iOS CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Manual iOS build check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Xcode project
        id: ios
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH=$(find . -maxdepth 4 -name '*.xcodeproj' -type d | head -n 1 || true)
          WORKSPACE_PATH=$(find . -maxdepth 4 -name '*.xcworkspace' -type d | head -n 1 || true)

          if [[ -z "$PROJECT_PATH" && -z "$WORKSPACE_PATH" ]]; then
            echo "has_ios=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project or workspace found. Manual iOS build skipped."
            exit 0
          fi

          echo "has_ios=true" >> "$GITHUB_OUTPUT"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "workspace_path=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      - name: Connect Xcode
        if: steps.ios.outputs.has_ios == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        if: steps.ios.outputs.has_ios == 'true'
        run: xcodebuild -version

      - name: Build iOS Simulator
        if: steps.ios.outputs.has_ios == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ steps.ios.outputs.workspace_path }}" ]]; then
            CONTAINER_ARGS=(-workspace "${{ steps.ios.outputs.workspace_path }}")
          else
            CONTAINER_ARGS=(-project "${{ steps.ios.outputs.project_path }}")
          fi

          SCHEME=$(xcodebuild -list "${CONTAINER_ARGS[@]}" | awk '/Schemes:/ {flag=1; next} flag && NF {print $1; exit}')
          if [[ -z "$SCHEME" ]]; then
            echo "No shared scheme found. Open the project in Xcode and share the scheme before running iOS CI." >&2
            exit 1
          fi

          DESTINATION=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [[ -z "$DESTINATION" ]]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi

          xcodebuild \
            "${CONTAINER_ARGS[@]}" \
            -scheme "$SCHEME" \
            -destination "id=$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Skip summary
        if: steps.ios.outputs.has_ios != 'true'
        run: echo "iOS CI is clean: there is no Xcode project/workspace to build right now."
